[package]
name = "macbase-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "macbase_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
shakmaty = "0.27"
pgn-reader = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"

[profile.release]
lto = true
